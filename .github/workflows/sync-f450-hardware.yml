name: Sync F450 hardware page

on:
  push:
    branches: [main]
    paths:
      - 'hub/drone_hardware_f450_v2.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Promote F450 hardware page
        run: |
          cp hub/drone_hardware_f450_v2.py hub/drone_hardware_clean.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hub/drone_hardware_clean.py
          if git diff --cached --quiet; then
            echo 'No hardware-page change to commit'
            exit 0
          fi
          git commit -m 'chore: promote F450 hardware page'
          git push
