[Service]
# Conservative local limits required by the no-battery prototype gate.
# Target altitude/speed match Downloads/param.param (WP_SPD = 0.5 m/s).
# These do not enable real dispatch or set the physical launch/home location.
Environment=MAX_MISSION_DURATION=120 GEOFENCE_RADIUS=60 CRUISE_ALT=1 CRUISE_SPEED=0.5
