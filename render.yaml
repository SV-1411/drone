# Render.com blueprint for the VanniKawachh hub (always-on, free tier, real HTTPS).
# Deploy: on render.com -> New -> Blueprint -> connect the SV-1411/drone repo.
# Render gives a public https URL like https://vannikawachh-hub.onrender.com
# Open <url>/node , <url>/drone-phone , <url>/ on your phones.
services:
  - type: web
    name: vannikawachh-hub
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn hub.webapp:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Default incident location when a phone can't share GPS. Set to your area.
      - key: TEST_LAT
        value: "21.1466"
      - key: TEST_LON
        value: "79.0889"
