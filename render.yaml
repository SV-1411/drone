# Render.com blueprint for the VanniKawachh hub (always-on, free tier, real HTTPS).
services:
  - type: web
    name: vannikawachh-hub
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn hub.webapp:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TEST_LAT
        value: "21.1466"
      - key: TEST_LON
        value: "79.0889"
      - key: SIMNET_HOST
        value: "136.67.142.218"
      - key: SIMNET_PORT
        value: "1515"
      - key: SIMNET_TAKEOFF_ALT_M
        value: "15"
      - key: SIMNET_PAYLOAD_SERVO
        value: "9"
      - key: SIMNET_PAYLOAD_PWM
        value: "1900"
      - key: SIMNET_REQUIRED
        value: "true"
